name: "每日選股訊號推播（LINE / Telegram）"

# 收盤後把「選股網綜合分前 N 名 + 技術面」推到手機（LINE 或 Telegram，由 NOTIFY_CHANNEL 選）。
# UTC 09:00 = TW 17:00（收盤後、當日盤後資料齊；對齊 update_macro_history.yml）。
# ⚠️ 排 Mon-Fri，未濾 TW 國定假日（無第三方 trading calendar，見 CLAUDE.md §4.5）。
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      top_n:
        description: "推播前 N 名"
        default: "10"
        required: false
      factors:
        description: "因子（逗號分隔；留空=全 5 因子）"
        default: ""
        required: false

concurrency:
  group: push-daily-signals
  cancel-in-progress: false

jobs:
  push:
    name: "Push daily signals"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Push daily signals
        env:
          # 管道:line（預設）/ telegram。可於 repo Variables 設 NOTIFY_CHANNEL 覆寫。
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'line' }}
          # LINE Messaging API（LINE Notify 已停用）
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # Telegram（備援管道）
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # AI 研判（偏多/偏空/需觀察）— 選填；未設則自動略過只送清單
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python scripts/push_daily_signals.py
          --top-n "${{ github.event.inputs.top_n || '10' }}"
          --factors "${{ github.event.inputs.factors || '' }}"
