name: 總經燈號每日落地 (Weekdays)

# 總經紅綠燈前進式驗證:每個交易日收盤後跑一次「與畫面完全同一條」的抓取 +
# calc_traffic_light,把當天的燈號/健康分/信心分數落地成一列 parquet。
#
# 為什麼需要:2026-08-19 實測發現 calc_traffic_light 的輸出從來沒有離開過瀏覽器
# session ⇒「紅燈準不準」在本 repo 沒有樣本外證據。唯一能離線重算的
# calibrate_macro_traffic 是重建版,實測至少兩處與線上系統性不同
# (conf 恆 60 vs 可達 100;m1b_m2_prev 有真值 vs 恆 None)。
#
# ⚠️ 誠實的預期:ICC 0.240 → 設計效應 8.9 → 每年僅約 7.5 個有效觀測 ⇒
# 要把紅燈 precision 的信賴區間收到 ±10pp 約需 10 年。本 workflow 的即期價值
# 不是統計顯著,而是讓這個數字第一次可被離線稽核。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '斷言觀測日 YYYY-MM-DD（留空 = 本輪實抓 ^TWII 最後交易日；不符即失敗、不寫列）'
        required: false
        default: ''
      dry_run:
        description: '只印不寫（true / 留空）'
        required: false
        default: ''
      publish_dry_run:
        description: '只印發布計畫、不推分支不開 PR（true / 留空；與上方 dry_run=腳本不寫列 是兩件事）'
        required: false
        default: ''
  schedule:
    # UTC 09:40 = TW 17:40,週一~週五。
    # 17:40 是刻意的:TWSE 三大法人約 14:30 才齊(CLAUDE.md §2.3),
    # Yahoo EOD 更晚;太早跑會系統性記到「資料還沒到」的缺腿狀態。
    - cron: '40 9 * * 1-5'

# 同一 job 的發布串行、不取消進行中的（避免同分支並行 push）。
concurrency:
  group: data-publish-macro-forward-test
  cancel-in-progress: false

jobs:
  capture-macro-signal:
    runs-on: ubuntu-latest
    # 抓取鏈含多源 fallback + 重試;fetch_macro_bundle 自身上限 100s,
    # 但冷啟動加上 FinMind/TWSE 重試實測可達數分鐘,給足預算。
    timeout-minutes: 25
    # 2026-11-06：發布改走「資料分支 + PR」（main 受 branch protection，裸 push 會 GH006）。
    permissions:
      contents: write        # 推 auto/data-macro-forward-test 分支（不是 main）
      pull-requests: write   # gh pr create / list / edit。不給 actions: write —— 本流程不 dispatch 任何 workflow（dispatch 的 checks 不符合 required checks）
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 發布 helper 需 merge origin/main 與切換分支

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Capture macro traffic light
        id: capture
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          NAS_BASE_URL: ${{ secrets.NAS_BASE_URL }}
          NAS_API_KEY: ${{ secrets.NAS_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.dry_run }}" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/update_macro_forward_test.py $ARGS

      - name: Publish via data PR (no direct push to main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.publish_dry_run }}
          OBS_DATE: ${{ steps.capture.outputs.observation_date }}
        run: |
          # 2026-11-06：原「git add / commit / push」改由 helper 執行，只推 auto/data-macro-forward-test 並開 PR。
          # 休市日 / 三來源全空 → 腳本刻意 exit 0 不寫列(§1 不落空殼),
          # 這裡無變更是**正常**,helper 印「無實質變更」並 exit 0,不是失敗。
          # 觀測日（= 實抓 ^TWII 最後一根 K 棒交易日）由腳本經 GITHUB_OUTPUT 交出；
          # 取不到時退回 runner 日期（只影響訊息文字，不影響資料）。
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$OBS_DATE" ]; then ARGS="$ARGS --observation-date $OBS_DATE"; fi
          python scripts/publish_data_pr.py --job macro-forward-test \
            --paths data_cache/macro_forward_test/ \
            --commit-msg "🤖 總經燈號落地：${OBS_DATE:-$(date +%Y-%m-%d)}" $ARGS
