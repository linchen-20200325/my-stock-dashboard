name: Update Sector Flow (Daily)

# 板塊資金泡泡圖 Stage 1:每日收盤後抓「全市場三大法人淨買超 × 收盤 × 產業別」,
# 彙總成 per-sector 每日 net 金額 → data_cache/sector_flow/ parquet + json,commit 進 repo。
# 子目錄落點 → git 追蹤不受 data_cache/*.parquet gitignore 影響(免 -f)。

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: '回抓近 N 日曆日（初次部署 / 補洞用）'
        required: false
        default: 'false'
      days:
        description: 'bootstrap 回溯日曆天（預設 30 ≈ 20 交易日）'
        required: false
        default: '30'
      dry_run:
        description: '只印發布計畫、不推分支不開 PR（true / 留空）'
        required: false
        default: ''
  schedule:
    # 每日 UTC 09:30（TW 17:30 收盤後，T86 / TPEX 三大法人盤後已備齊）
    - cron: '30 9 * * *'

# 同一 job 的發布串行、不取消進行中的（避免同分支並行 push）。
concurrency:
  group: data-publish-sector-flow
  cancel-in-progress: false

jobs:
  update-sector-flow:
    runs-on: ubuntu-latest
    # 2026-11-06：發布改走「資料分支 + PR」（main 受 branch protection，裸 push 會 GH006）。
    permissions:
      contents: write        # 推 auto/data-sector-flow 分支（不是 main）
      pull-requests: write   # gh pr create / list
      actions: write         # gh workflow run pr-check.yml（GITHUB_TOKEN 的 push 不觸發 workflow，須 dispatch 才有 required check）
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 發布 helper 需 merge origin/main 與切換分支

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sector-flow-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        # 完整 requirements:import src.data.core.* / src.data.stock.* 會觸發套件
        # __init__ sibling eager import(data_loader → streamlit、tw_stock_data_fetcher → bs4),
        # 裝齊避免 ModuleNotFoundError(同 update_macro_history / update_fundamentals 慣例)。
        run: pip install -r requirements.txt

      - name: Fetch sector flow data
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          NAS_BASE_URL: ${{ secrets.NAS_BASE_URL }}
          NAS_API_KEY: ${{ secrets.NAS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.bootstrap }}" = "true" ]; then
            python scripts/update_sector_flow.py --bootstrap --days ${{ github.event.inputs.days || '30' }}
          else
            python scripts/update_sector_flow.py
          fi

      - name: Publish via data PR (no direct push to main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          # 2026-11-06：原「git add / commit / push」改由 helper 執行，只推 auto/data-sector-flow 並開 PR。
          # 子目錄 data_cache/sector_flow/ 不受 data_cache/*.parquet gitignore 影響 → 免 -f（不帶 --force-add）
          # metadata/bubble_latest/industry_raw 的 updated_at/fetched_at 每次必變，由 helper 判定「無實質變更」則不開 PR。
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          python scripts/publish_data_pr.py --job sector-flow \
            --paths data_cache/sector_flow/ \
            --commit-msg "🤖 板塊資金泡泡圖每日增量：$(date +%Y-%m-%d)" $ARGS
