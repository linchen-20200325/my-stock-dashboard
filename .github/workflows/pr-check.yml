name: "PR Check（pytest fast + AppTest slow）"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════
  # Fast lane — pytest -m "not slow"(預設;單元測試 ~秒級)
  # 失敗即阻擋 merge
  # ════════════════════════════════════════════════════════════
  fast-checks:
    name: "Fast checks (pytest unit, ~30s)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 批 Z59（客戶 Q-z33＝A）：markdown-it-py 是**測試依賴**（production 0 import），
          # 與 pytest 同列、⛔ 不進 requirements.txt（那份會裝上 Streamlit Cloud）。
          # 沒裝時 22 個 CommonMark 守衛會靜默 skip —— tests/test_batch_z59.py 改成紅燈。
          pip install pytest pyflakes "markdown-it-py>=3.0.0,<5.0.0"

      - name: Run pytest fast lane
        run: pytest -v

  # ════════════════════════════════════════════════════════════
  # Slow lane — AppTest(單測約 1-30s)
  # 非阻擋(continue-on-error),作為 informational signal
  # 對齊 Fund pr-check.yml 結構 + v18.283 引入
  # 2026-10-24 客戶裁示 DEC-078：與 Fast 平行開始(不再 needs: fast-checks);Fast 仍 blocking、Slow 仍 informational
  # ════════════════════════════════════════════════════════════
  slow-tests:
    name: "Slow tests (AppTest, informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run AppTest (slow lane)
        env:
          FRED_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
          FINMIND_TOKEN: "ci-test-token"
        run: pytest -v -m slow --tb=short

  # ════════════════════════════════════════════════════════════
  # New UI2 browser lane（DEC-137）— 真瀏覽器行為測試，缺瀏覽器 = 紅（skip ≠ PASS）
  # matrix: Streamlit floor 1.56.0 與 1.59.2；與 Fast 平行。
  # 固定名稱 gate job `ui2-browser-gate` 才是建議的 required check（matrix 名稱不綁死）。
  # ⚠️ 需 user 在 GitHub Settings → Branches → Branch protection rules → main → Require status checks 加入
  #    `ui2-browser-gate`；未設定前 required 不生效（本 repo AI 工作階段無權限讀寫該設定）。
  # ════════════════════════════════════════════════════════════
  ui2-browser:
    name: "ui2-browser (streamlit ${{ matrix.streamlit }})"
    runs-on: ubuntu-latest
    # DEC-170（客戶授權之 CI 環境最小修復，方案 B；方案 A 已由 CI 實證失效：該 runner 的
    # azure/archive/security.ubuntu.com 三個 host 皆 DNS 解析失敗）：本 job 改在固定「版本＋digest」的
    # Playwright 官方容器內執行，系統相依套件與 Chromium 已預裝，runner 完全不需要 apt。
    # 容器相容性說明：
    #  - 映像為 Ubuntu 24.04(noble)/linux-amd64、預設 root、ENV PLAYWRIGHT_BROWSERS_PATH=/ms-playwright；
    #    內建 Node（GitHub 亦會掛載 runner 自帶 node 供 JS actions 使用）。
    #  - tests 以 `p.chromium.launch()` 預設參數啟動（無自訂 args）；root 下 Playwright 預設
    #    chromiumSandbox=false 會自動加 --no-sandbox，容器內可正常啟動，無須改測試。
    #  - Playwright 官方文件建議 Docker 執行 Chromium 加 --ipc=host（避免共享記憶體不足導致崩潰），故設 options。
    #  - actions/setup-python 於容器 job 可用（Ubuntu 基底，工具快取目錄由 runner 掛入）。
    #  - 不使用 latest；tag 保留供閱讀，digest 為不可變的實際依據（升 Playwright 時 tag、digest、pip pin 一併更新）。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    # 容器 job 的 run 預設 shell 為 `sh -e`（dash，不支援 pipefail）；統一用映像內的 bash，行為與原 runner 一致。
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        streamlit: ["1.56.0", "1.59.2"]
    env:
      UI2_BROWSER_LANE: required
      UI2_EXPECT_STREAMLIT: ${{ matrix.streamlit }}
      FRED_API_KEY: "ci-test-key"
      GEMINI_API_KEY: "ci-test-key"
      FINMIND_TOKEN: "ci-test-token"
    steps:
      - uses: actions/checkout@v4

      # 容器 job 不啟用 `cache: pip`：setup-python 的 pip 快取需呼叫 lsb_release 算快取鍵，
      # 而 Playwright 映像沒有 lsb_release 且無法 apt 安裝；此僅為效能快取，不影響測試語意。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "streamlit==${{ matrix.streamlit }}" pytest "playwright==1.64.1"

      - name: Install Chromium
        run: |
          set -euo pipefail
          # 容器已預裝 Chromium；此處僅驗證並在版本不符時下載瀏覽器本體（不使用 apt、不加 --with-deps）。
          # 任何失敗 -> 步驟失敗（不吞錯、不 continue-on-error）。
          python -m playwright --version
          echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:?PLAYWRIGHT_BROWSERS_PATH 未設定}"
          ls "$PLAYWRIGHT_BROWSERS_PATH"
          python -m playwright install chromium
          ls "$PLAYWRIGHT_BROWSERS_PATH"

      - name: Run New UI2 browser lane
        run: |
          mkdir -p ui2_browser_out
          pytest -v -m ui2_browser -rs --tb=short --junitxml=ui2_browser_out/junit.xml tests/test_ui2_drawer_browser.py tests/test_ui2_batch2.py

      - name: Enforce no-skip and minimum test count
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse("ui2_browser_out/junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"tests={tests} skipped={skipped} failures={s.get('failures')} errors={s.get('errors')}")
          if skipped > 0 or tests < 40:
              sys.exit(f"browser lane: skipped={skipped} (must be 0), tests={tests} (min 40)")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui2-browser-${{ matrix.streamlit }}
          path: ui2_browser_out/

  ui2-browser-gate:
    name: "ui2-browser-gate"
    runs-on: ubuntu-latest
    needs: ui2-browser
    if: always()
    steps:
      - name: Require every ui2-browser matrix cell to pass
        run: |
          echo "ui2-browser result: ${{ needs.ui2-browser.result }}"
          test "${{ needs.ui2-browser.result }}" = "success"
