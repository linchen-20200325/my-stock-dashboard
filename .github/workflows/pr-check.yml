name: "PR Check（pytest fast + AppTest slow）"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════
  # Fast lane — pytest -m "not slow"(預設;單元測試 ~秒級)
  # 失敗即阻擋 merge
  # ════════════════════════════════════════════════════════════
  fast-checks:
    name: "Fast checks (pytest unit, ~30s)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 批 Z59（客戶 Q-z33＝A）：markdown-it-py 是**測試依賴**（production 0 import），
          # 與 pytest 同列、⛔ 不進 requirements.txt（那份會裝上 Streamlit Cloud）。
          # 沒裝時 22 個 CommonMark 守衛會靜默 skip —— tests/test_batch_z59.py 改成紅燈。
          pip install pytest pyflakes "markdown-it-py>=3.0.0,<5.0.0"

      - name: Run pytest fast lane
        run: pytest -v

  # ════════════════════════════════════════════════════════════
  # Slow lane — AppTest(單測約 1-30s)
  # 非阻擋(continue-on-error),作為 informational signal
  # 對齊 Fund pr-check.yml 結構 + v18.283 引入
  # 2026-10-24 客戶裁示 DEC-078：與 Fast 平行開始(不再 needs: fast-checks);Fast 仍 blocking、Slow 仍 informational
  # ════════════════════════════════════════════════════════════
  slow-tests:
    name: "Slow tests (AppTest, informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run AppTest (slow lane)
        env:
          FRED_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
          FINMIND_TOKEN: "ci-test-token"
        run: pytest -v -m slow --tb=short

  # ════════════════════════════════════════════════════════════
  # New UI2 browser lane（DEC-137）— 真瀏覽器行為測試，缺瀏覽器 = 紅（skip ≠ PASS）
  # matrix: Streamlit floor 1.56.0 與 1.59.2；與 Fast 平行。
  # 固定名稱 gate job `ui2-browser-gate` 才是建議的 required check（matrix 名稱不綁死）。
  # ⚠️ 需 user 在 GitHub Settings → Branches → Branch protection rules → main → Require status checks 加入
  #    `ui2-browser-gate`；未設定前 required 不生效（本 repo AI 工作階段無權限讀寫該設定）。
  # ════════════════════════════════════════════════════════════
  ui2-browser:
    name: "ui2-browser (streamlit ${{ matrix.streamlit }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        streamlit: ["1.56.0", "1.59.2"]
    env:
      UI2_BROWSER_LANE: required
      UI2_EXPECT_STREAMLIT: ${{ matrix.streamlit }}
      FRED_API_KEY: "ci-test-key"
      GEMINI_API_KEY: "ci-test-key"
      FINMIND_TOKEN: "ci-test-token"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "streamlit==${{ matrix.streamlit }}" pytest "playwright==1.64.1"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium

      # DEC-170（客戶授權之 CI 環境最小修復，方案 A）：runner 的 apt 來源 mirror+file:/etc/apt/apt-mirrors.txt
      # 首選 azure.archive.ubuntu.com；該 mirror DNS 解析失敗時 `playwright install --with-deps` 會卡約 10 分鐘後 exit 100。
      # 本步驟：輸出診斷 → 僅在 azure mirror 無法解析時：設 apt 重試／逾時上限並改用 Ubuntu 官方來源
      # （保留簽章驗證：Signed-By 沿用原檔；不加 --allow-unauthenticated；不使用非官方鏡像）。健康時不改動來源。
      - name: Prepare apt for Chromium system dependencies
        run: |
          set -euo pipefail
          resolves() { getent hosts "$1" >/dev/null 2>&1; }

          echo "::group::apt diagnostics (before)"
          lsb_release -a 2>/dev/null || cat /etc/os-release
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          echo "--- /etc/apt/apt-mirrors.txt"; cat /etc/apt/apt-mirrors.txt 2>/dev/null || echo "(absent)"
          echo "--- apt sources"; grep -rn -E '^(URIs|Suites|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          for h in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if resolves "$h"; then echo "DNS ok: $h ($(getent hosts "$h" | head -n1))"; else echo "DNS FAIL: $h"; fi
          done
          echo "::endgroup::"

          azure_ok=0
          for i in 1 2 3; do
            if resolves azure.archive.ubuntu.com; then azure_ok=1; break; fi
            echo "azure.archive.ubuntu.com unresolved (attempt $i/3)"; sleep 5
          done

          if [ "$azure_ok" = "1" ]; then
            echo "azure mirror resolves; apt sources left unchanged."
            exit 0
          fi

          echo "azure mirror unresolvable -> switching mirror+file entries to official Ubuntu archives (signatures still verified)."
          # 僅失敗路徑：有上限的重試與逾時，避免 10 分鐘卡死（健康路徑不改任何 apt 設定）
          sudo tee /etc/apt/apt.conf.d/99ui2-ci-retry >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          EOF
          backup_dir=/etc/apt/ui2-ci-backup
          sudo mkdir -p "$backup_dir"
          changed=0
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            grep -q 'mirror+file:/etc/apt/apt-mirrors.txt' "$f" || continue
            sudo cp -n "$f" "$backup_dir/$(basename "$f").orig"
            tmp="$(mktemp)"
            case "$f" in
              *.sources)
                # deb822：以空行分段；僅含 security suite 的段落 -> security.ubuntu.com，其餘 -> archive.ubuntu.com
                awk 'BEGIN{RS="";ORS="\n\n"}
                  /mirror\+file:\/etc\/apt\/apt-mirrors\.txt/ {
                    n=split($0, L, "\n"); sec=0; oth=0
                    for (i=1;i<=n;i++) if (L[i] ~ /^Suites:/) { m=split(L[i], T, /[ \t]+/); for (j=2;j<=m;j++) if (T[j]!="") { if (T[j] ~ /security/) sec++; else oth++ } }
                    host = (sec>0 && oth==0) ? "https://security.ubuntu.com/ubuntu/" : "https://archive.ubuntu.com/ubuntu/"
                    sub(/mirror\+file:\/etc\/apt\/apt-mirrors\.txt/, host)
                  }
                  {print}' "$f" > "$tmp" ;;
              *)
                awk '/mirror\+file:\/etc\/apt\/apt-mirrors\.txt/ {
                    host = ($0 ~ /security/) ? "https://security.ubuntu.com/ubuntu/" : "https://archive.ubuntu.com/ubuntu/"
                    sub(/mirror\+file:\/etc\/apt\/apt-mirrors\.txt/, host)
                  } {print}' "$f" > "$tmp" ;;
            esac
            sudo install -m 644 -o root -g root "$tmp" "$f"
            rm -f "$tmp"
            changed=1
            echo "rewrote $f"
          done
          if [ "$changed" = "0" ]; then
            echo "::error::azure mirror unresolvable but no mirror+file apt source found to rewrite"; exit 1
          fi

          for h in archive.ubuntu.com security.ubuntu.com; do
            if ! resolves "$h"; then echo "::error::official host $h also unresolvable; apt cannot work on this runner (escalate to plan B)"; exit 1; fi
          done
          echo "::group::apt sources (after)"
          grep -rn -E '^(URIs|Suites|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          echo "::endgroup::"
          sudo timeout 300 apt-get update

      - name: Install Chromium
        run: |
          set -euo pipefail
          # 最多 3 次、間隔 30 秒；每次 10 分鐘上限。最終失敗 -> 步驟失敗（不吞錯、不 continue-on-error）。
          for attempt in 1 2 3; do
            echo "playwright install attempt $attempt/3"
            if timeout --foreground 600 python -m playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then echo "attempt $attempt failed; retrying in 30s"; sleep 30; fi
          done
          echo "::error::playwright install --with-deps chromium failed after 3 attempts"
          exit 1

      - name: Run New UI2 browser lane
        run: |
          mkdir -p ui2_browser_out
          pytest -v -m ui2_browser -rs --tb=short --junitxml=ui2_browser_out/junit.xml tests/test_ui2_drawer_browser.py tests/test_ui2_batch2.py

      - name: Enforce no-skip and minimum test count
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse("ui2_browser_out/junit.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          tests, skipped = int(s.get("tests")), int(s.get("skipped"))
          print(f"tests={tests} skipped={skipped} failures={s.get('failures')} errors={s.get('errors')}")
          if skipped > 0 or tests < 40:
              sys.exit(f"browser lane: skipped={skipped} (must be 0), tests={tests} (min 40)")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui2-browser-${{ matrix.streamlit }}
          path: ui2_browser_out/

  ui2-browser-gate:
    name: "ui2-browser-gate"
    runs-on: ubuntu-latest
    needs: ui2-browser
    if: always()
    steps:
      - name: Require every ui2-browser matrix cell to pass
        run: |
          echo "ui2-browser result: ${{ needs.ui2-browser.result }}"
          test "${{ needs.ui2-browser.result }}" = "success"
