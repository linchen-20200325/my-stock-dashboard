name: "PR Check（pytest fast + AppTest slow）"

on:
  pull_request:
    # ⚠️ 語意:pull_request 的 branches 過濾的是 PR 的**目標(base)分支**,不是來源分支。
    #    所以 `ui-v2 → v2` 的 PR 本來就會跑(base=v2 已在列);加上 ui-v2 多涵蓋的是
    #    **以 ui-v2 為 base 的 PR**(例:功能子分支 → ui-v2)。
    branches: [main, v2, ui-v2]
  push:
    # 2026-09-21 補 ui-v2(決策者:AI 總管;CLAUDE.md §-1.5.D §03-1「CI 配置同步更新」
    # 明文屬內部自決區)。補之前 push 到 ui-v2 不觸發任何 CI —— UI v2 的開發線
    # 整條沒有守衛,包含剛補進 tests/test_c3_layering_guard.py 的 src/ui_v2/ 分層守衛。
    branches: [main, v2, ui-v2]
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════
  # Fast lane — pytest -m "not slow"(預設;單元測試 ~秒級)
  # 失敗即阻擋 merge
  # ════════════════════════════════════════════════════════════
  fast-checks:
    name: "Fast checks (pytest unit, ~30s)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Run pytest fast lane
        run: pytest -v

  # ════════════════════════════════════════════════════════════
  # Slow lane — AppTest(單測約 1-30s)
  # 非阻擋(continue-on-error),作為 informational signal
  # 對齊 Fund pr-check.yml 結構 + v18.283 引入
  # ════════════════════════════════════════════════════════════
  slow-tests:
    name: "Slow tests (AppTest, informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: fast-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run AppTest (slow lane)
        env:
          FRED_API_KEY: "ci-test-key"
          GEMINI_API_KEY: "ci-test-key"
          FINMIND_TOKEN: "ci-test-token"
        run: pytest -v -m slow --tb=short
