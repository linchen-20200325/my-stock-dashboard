[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
markers =
    slow: Streamlit AppTest 等 runtime e2e(單測 >5s);CI slow lane 跑;一般 `pytest` 預設不跑
    ui2_browser: New UI2 真瀏覽器行為測試(Playwright+Chromium);CI `ui2-browser` lane(UI2_BROWSER_LANE=required,缺瀏覽器=紅)跑;一般 `pytest` 預設不跑
addopts = --strict-markers -m "not slow and not ui2_browser"
